<script>
/* ===== CONFIG: endpoint del server Python. Se non rispondono, la GUI parte in modalità demo. ===== */
const API={login:"/api/login",status:"/api/status",scan:"/api/scan",reports:"/api/reports",logout:"/api/logout"};
let SID="";const H=()=>({"X-Session":SID});
const store=(k,v,persist)=>{try{(persist?localStorage:sessionStorage).setItem(k,v)}catch(_){}};
const unstore=k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(_){}};
/* API del tuo osint_gui.py: POST /api/login {user,pass} -> {session} | header X-Session | POST /api/scan -> {pdf,stats,events} | GET /api/reports */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function fit(){
  const vis=$("#login").classList.contains("hidden")?$("#app .stage"):$("#login .stage");
  const W=vis.offsetWidth,H=vis.offsetHeight,k=Math.min(innerWidth/W,innerHeight/H);
  $$(".stage").forEach(s=>s.style.transform=`scale(${k}) translate(-50%,-50%)`);
}
addEventListener("resize",fit);

async function getJSON(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("#err").textContent="";
  const user=$("#u").value.trim(),pass=$("#p").value;
  try{
    const r=await fetch(API.login,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user,pass})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.session){$("#err").textContent=d.error||"Credenziali non valide.";return}
    SID=d.session;store("osint_session",SID,$("#rem").checked);
    // Il login apre una sessione pulita: il log non deve mostrare vecchi report.
    enter(user,false,{},{})
  }catch(_){if(location.protocol==="file:")enter(user||"Kali",true);else $("#err").textContent="Server non raggiungibile."}
});
$("#forgot").addEventListener("click",()=>$("#err").textContent="Contatta l'amministratore.");
$("#logout").addEventListener("click",()=>{if(!demo)fetch(API.logout,{method:"POST",headers:H()}).catch(()=>{});unstore("osint_session");SID="";clearInterval(timer);cancelAnimationFrame(raf);$("#app").classList.add("hidden");$("#login").classList.remove("hidden");$("#p").value="";fit()});

const ALL=[];
const FILT={leaks:/> Emails/,dns:/> DNS Records/,map:/> Domains/};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function showPage(p){
  const o=$("#pg-other");o.classList.remove("hidden");
  if(p==="search"){
    o.innerHTML='<div class="sfw"><h3 class="t1">New scan</h3><label>Username<input id="f-u" autocomplete="off"></label><label>Email<input id="f-e" autocomplete="off"></label><label>Phone<input id="f-p" autocomplete="off" placeholder="+39..."></label><label>Domain<input id="f-d" autocomplete="off"></label><button id="f-go">Start scan</button><div id="f-msg"></div></div>';
    $("#f-go").onclick=async()=>{
      const m=t=>$("#f-msg").textContent=t,body={username:$("#f-u").value,email:$("#f-e").value,phone:$("#f-p").value,domain:$("#f-d").value};
      if(!body.username.trim()&&!body.email.trim()&&!body.phone.trim()&&!body.domain.trim())return m("Enter at least one value.");
      if(demo)return m("Demo mode: no server connected.");
      if(busy)return m("A scan is already running.");
      $('[data-p=dash]').click();runScan(body)};
    return;
  }
  let lines;
  if(FILT[p])lines=ALL.filter(l=>FILT[p].test(l));
  else if(p==="hist"){
    let rep=[];if(!demo){try{const r=await fetch(API.reports,{headers:H()});if(r.ok)rep=(await r.json()).reports||[]}catch(_){}}
    o.innerHTML='<div class="lst">'+(rep.length?rep.map(x=>'<div><a style="color:#ff4a3d" target="_blank" href="/reports/'+encodeURIComponent(x)+'?session='+encodeURIComponent(SID)+'">'+esc(x)+'</a></div>').join(""):'<div style="color:#8c909a">No reports yet.</div>')+"</div>";return}
  else lines=["ENGINE: ACTIVE","HOST: 127.0.0.1","PORT: 8766","MODE: PUBLIC ONLY","REPORT FORMAT: PDF ONLY","RETENTION: 30 GIORNI","SESSION: 4 ORE"];
  o.innerHTML='<div class="lst">'+(lines.length?lines.map(l=>"<div>"+esc(l)+"</div>").join(""):'<div style="color:#8c909a">No data yet.</div>')+"</div>";
}
$$(".nav").forEach(b=>b.addEventListener("click",()=>{
  const dash=b.dataset.p==="dash";
  $$(".nav").forEach(x=>{x.classList.toggle("on",x===b);const s=x.querySelector("small");if(s)s.remove()});
  if(dash){$("#pg-other").classList.add("hidden");b.querySelector("span")?.insertAdjacentHTML("beforeend","<small>Active</small>")}
  else showPage(b.dataset.p);
}));

const threatOf=s=>{const c=(s.accounts|0)+(s.emails|0);return c<3?"Low":c<10?"Medium":"High"};
function applyStats(s){
  live={d:s.domains|0,e:s.emails|0,n:s.dns|0,a:s.accounts|0};setStat();
  const th=threatOf(s);$("#st-thr").textContent=th;$("#st-thr").style.color=th==="High"?"#ff4a3d":th==="Medium"?"#f0b429":"";

async function runScan(body){
  if(busy)return;busy=true;
  const tgt=body.username||body.email||body.domain;$("#target").textContent=tgt;
  $("#st-eng").textContent="Active";N.length=1;E.length=0;live={d:0,e:0,n:0,a:0};setStat();
  addLog(`[${ts()}] > Scan started ${tgt}`);
  try{
    const r=await fetch(API.scan,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},H()),body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){$("#logout").click();return}
    if(!r.ok||!d.ok)throw new Error(d.error||"Scan failed");
    applyStats(d.stats||{});
    (d.events||[]).forEach(x=>{addLog(`[${ts()}] > ${x.kind} ${x.text}`);if(/^(Domains|Emails|Accounts)$/.test(x.kind))addNode(x.text.split(" ")[0])});
    addLog(`[${ts()}] > Report ${d.pdf}`);
  }catch(e){addLog(`[${ts()}] > Error ${e.message}`)}
  finally{busy=false;$("#st-eng").textContent="Idle"}
}

  }

}
